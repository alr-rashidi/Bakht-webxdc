name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update manifest.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}   # removes the leading "v"
          echo "Updating version to $VERSION"
          # Remove old version line if it exists
          sed -i '/^version = /d' manifest.toml
          # Add version at the last line
          echo "version = \"$VERSION\"" >> manifest.toml
          cat manifest.toml

      - name: Build .xdc file
        run: |
          zip -r Bakht.xdc . \
            -x ".git/*" \
            -x ".github/*" \
            -x "temp/*" \
            -x "git-assets/*" \
            -x "README.md"
          echo "=== Contents of Bakht.xdc ==="
          unzip -l Bakht.xdc
          test -s Bakht.xdc

      - name: Upload .xdc as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bakht.xdc
          path: Bakht.xdc
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Bakht.xdc
          generate_release_notes: true
